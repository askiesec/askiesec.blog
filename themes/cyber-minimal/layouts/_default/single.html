{{ define "main" }}
    <article>
        <h1 style="margin-bottom: 0.5rem;">{{ .Title }}</h1>
        
        <div style="color: var(--meta-color); font-family: var(--font-mono); font-size: 0.9em; margin-bottom: 2rem;">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
            
            <span style="margin: 0 0.5rem;">&middot;</span>
            <span>~{{ .ReadingTime }} min read</span>
            
            {{ if .Params.tags }}
                <span style="margin: 0 0.5rem;">&middot;</span>
                {{ range .Params.tags }}
                    <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}" style="color: var(--meta-color);">#{{ . }}</a>
                {{ end }}
            {{ end }}
        </div>
        
        <div class="content">
            {{ .Content }}
        </div>
    </article>
{{ end }}
